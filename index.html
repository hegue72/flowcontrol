<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>塔臺流量管制作業系統</title>

  <!-- 引入 Firebase SDK (v10.8.0 Compat 版本) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    /* 全局樣式設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
      background-color: #f0f4f8;
      color: #0f172a;
      line-height: 1.4;
      padding: 10px 4vw;
    }

    .container {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 懸浮提示卡片 */
    .tutorial-card-pop {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 900;
      border: 1.5px solid #fef08a;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      white-space: nowrap;
    }

    /* 凍結窗格頂部固定區域 */
    .sticky-top-pane {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #f0f4f8;
      padding-bottom: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 6px 10px -4px rgba(0, 0, 0, 0.1);
    }

    /* A. 頁首區塊 */
    header {
      background-color: #0f2a4a;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tower-icon-custom {
      height: 36px;
      width: auto;
      flex-shrink: 0;
      display: block;
    }

    .header-left h1 {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      margin-left: auto;
    }

    .active-type-badge {
      background-color: #f97316;
      color: #ffffff;
      padding: 3px 12px;
      border-radius: 9999px;
      font-weight: bold;
      font-size: 1.15rem;
      box-shadow: 0 2px 4px rgba(249, 115, 22, 0.4);
      display: inline-block;
    }

    .status-role-badge {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .role-viewer {
      background-color: #64748b;
      color: #ffffff;
    }

    .role-editor {
      background-color: #22c55e;
      color: #ffffff;
    }

    /* 視圖頁籤 */
    .view-tabs {
      display: flex;
      gap: 6px;
      background-color: #ffffff;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 6px 16px;
      font-weight: bold;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      color: #475569;
      font-size: 0.95rem;
      font-family: inherit;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tab-btn svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: #64748b;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s ease;
    }

    .tab-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .tab-btn.active {
      background-color: #1d4ed8 !important;
      color: #ffffff !important;
      border: 1px solid #1d4ed8 !important;
      box-shadow: 0 4px 10px rgba(29, 78, 216, 0.35) !important;
      font-weight: 900 !important;
    }

    .tab-btn.active svg {
      stroke: #ffffff !important;
    }

    /* B. 類型選擇區 */
    .type-selection-bar {
      background-color: #ffffff;
      border-radius: 6px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .type-buttons-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
      flex: 1;
    }

    /* 按鈕樣式 */
    .btn {
      padding: 4px 10px;
      font-size: 0.88rem;
      font-weight: bold;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background-color: #ffffff;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn-type-sm {
      padding: 4px 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #94a3b8;
      background-color: #f8fafc;
      color: #1e3a8a;
      min-height: 30px;
      position: relative;
      transition: all 0.15s ease;
    }

    .btn-type-sm.active {
      background-color: #1d4ed8;
      color: #ffffff;
      border: 1px solid #1d4ed8;
      box-shadow: 0 3px 8px rgba(29, 78, 216, 0.35);
      font-size: 1.05rem;
      font-weight: 900;
    }

    .modal-type-btn {
      padding: 8px 12px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      border: 1.5px solid #cbd5e1;
      background-color: #f8fafc;
      color: #1e3a8a;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
      text-align: center;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .modal-type-btn:hover {
      background-color: #e2e8f0;
      border-color: #2563eb;
    }

    .modal-type-btn.active {
      background-color: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
      box-shadow: 0 4px 10px rgba(29, 78, 216, 0.35);
      font-weight: 900;
    }

    .type-delete-x {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      background: #ef4444;
      color: #ffffff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 900;
      line-height: 1;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
      z-index: 5;
    }

    .type-delete-x:hover {
      background: #dc2626;
    }

    #btnOpenTypeModal {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
    }

    #btnOpenTypeModal:hover {
      background-color: #1d4ed8;
    }

    #btnAddCustomTypeModal {
      background-color: #766D79 !important;
      border-color: #766D79 !important;
      color: #ffffff !important;
      font-size: 0.85rem !important;
      padding: 4px 12px !important;
    }

    .btn-filter-pill {
      padding: 3px 9px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 9999px;
      border: 1px solid #94a3b8;
      background-color: #ffffff;
      color: #334155;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-filter-pill.active {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .btn-x {
      background-color: #ef4444;
      color: #ffffff;
      border: 1px solid #dc2626;
      border-radius: 4px;
      padding: 2px 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-x:hover {
      background-color: #dc2626;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .btn-danger {
      background-color: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    .btn-secondary {
      background-color: #64748b;
      color: #ffffff;
      border-color: #64748b;
    }

    /* C. 類型設定區 */
    .settings-bar {
      background-color: #ffffff;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .minutes-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .input-field {
      padding: 3px 6px;
      border: 1.5px solid #cbd5e1;
      border-radius: 4px;
      font-size: 1.05rem;
      font-weight: bold;
      font-family: inherit;
      width: 85px;
      text-align: center;
      transition: all 0.2s ease;
    }

    #inputMinutes {
      font-size: 1.25rem !important;
      font-weight: 900 !important;
      color: #0f2a4a !important;
      width: 72px;
      height: 32px;
      border: 2px solid #2563eb;
      background-color: #ffffff !important;
      letter-spacing: 0.5px;
      border-radius: 6px;
    }

    /* 呼吸燈與高脈衝閃爍特效 */
    @keyframes pulseGlowMore {
      0% { transform: scale(1); box-shadow: 0 0 4px rgba(37, 99, 235, 0.4); }
      50% { transform: scale(1.12); box-shadow: 0 0 18px rgba(37, 99, 235, 0.85), 0 0 0 4px rgba(37, 99, 235, 0.3); }
      100% { transform: scale(1); box-shadow: 0 0 4px rgba(37, 99, 235, 0.4); }
    }

    @keyframes pulseInputStep1 {
      0% { transform: scale(1); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }
      50% { transform: scale(1.08); box-shadow: 0 0 16px rgba(37, 99, 235, 0.85); }
      100% { transform: scale(1); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25); }
    }

    @keyframes intensePulseStep2 {
      0% { transform: scale(1); box-shadow: 0 0 4px rgba(220, 38, 38, 0.6); }
      50% { transform: scale(1.08); box-shadow: 0 0 16px rgba(220, 38, 38, 1), 0 0 0 4px rgba(254, 240, 138, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 4px rgba(220, 38, 38, 0.6); }
    }

    .step-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      line-height: 1;
      white-space: nowrap;
    }

    .step-label { display: inline-flex; align-items: center; gap: 2px; }
    .step-num { font-size: 1.25em; transform: translateY(-1px); }

    .step-pill-1 { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .step-pill-1.active-guide { background-color: #2563eb !important; color: #ffffff !important; animation: pulseGlowMore 1.2s infinite ease-in-out !important; }

    .step-pill-2 { background-color: #fef3c7; color: #92400e; border: 1px solid #fde047; }
    .step-pill-2.active-guide { background-color: #dc2626 !important; color: #ffffff !important; animation: intensePulseStep2 1.2s infinite ease-in-out !important; }

    .step-pill.shrunk-check { padding: 2px 6px !important; border-radius: 9999px !important; background-color: #16a34a !important; color: #ffffff !important; animation: none !important; }
    .step-pill.shrunk-check .step-text { display: none !important; }

    .input-field.guide-glow-step1 { border: 2.5px solid #2563eb !important; animation: pulseInputStep1 1.4s infinite ease-in-out !important; }

    #inputEtd1 { width: 92px !important; height: 38px !important; font-size: 1.2rem !important; font-weight: 900 !important; border-radius: 6px; }
    .table-input.guide-glow-step2 { border: 2.5px solid #dc2626 !important; animation: intensePulseStep2 1.2s infinite ease-in-out !important; }

    .input-error { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
    .error-text { color: #dc2626; font-size: 0.85rem; }

    .action-buttons-group { display: flex; flex-wrap: wrap; gap: 4px; }

    /* 表格與唯讀相容樣式 */
    .table-responsive {
      width: 100%; overflow-x: auto; overflow-y: auto; max-height: calc(100dvh - 240px);
      border: 1px solid #94a3b8; border-radius: 6px; background-color: #ffffff;
    }

    .data-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; min-width: 780px; }
    .data-table th { background-color: #0f2a4a; color: #ffffff; font-size: 1.05rem; font-weight: bold; padding: 8px 6px; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #64748b; }
    .data-table td { padding: 6px 4px; border-bottom: 1px solid #94a3b8; border-right: 1px solid #94a3b8; font-size: 1.1rem; font-weight: bold; }

    .data-table tr:nth-child(odd) { background-color: #ffffff; }
    .data-table tr:nth-child(even) { background-color: #e2e8f0; }
    .data-table tr:hover { background-color: #fef08a !important; }

    .callsign-cell-wrapper { display: flex; align-items: center; gap: 6px; width: 100%; position: relative; }
    .drag-handle { user-select: none; padding: 4px 8px; cursor: grab; color: #64748b; font-size: 1.5rem; }

    .table-input {
      width: 100%; padding: 4px 6px; height: 36px; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center;
      font-size: 1.1rem; font-weight: bold; background-color: #fefef0;
    }

    /* 觀看者模式下鎖定 Input 欄位背景 */
    .table-input[readonly], .input-field[readonly] {
      background-color: #e2e8f0 !important;
      color: #334155 !important;
      border-color: #cbd5e1 !important;
      cursor: not-allowed;
      animation: none !important;
      box-shadow: none !important;
    }

    .cartoon-row-51 { background: linear-gradient(135deg, #fef08a 0%, #fde047 100%) !important; }
    .cartoon-cell-51 { font-family: "Impact", "Comic Sans MS", "微軟正黑體", sans-serif !important; font-size: 1.5rem !important; font-weight: 900 !important; color: #dc2626 !important; padding: 10px !important; text-align: center; }

    .read-only-cell { background-color: #cbd5e1; color: #0f172a; font-weight: bold; font-size: 1.1rem; padding: 4px 6px; border-radius: 4px; min-height: 34px; line-height: 26px; }

    /* 預估後推時間：超級醒目藍色漸層 + 立體邊框 + 光澤陰影 */
    .highlight-pbt-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f2a4a 100%) !important;
      color: #fef08a !important;
      font-size: 1.15rem !important;
      font-weight: 900 !important;
      border-left: 2px solid #3b82f6 !important;
      border-right: 2px solid #3b82f6 !important;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .read-only-cell.pbt {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%) !important;
      color: #ffffff !important;
      font-weight: 900 !important;
      font-size: 1.2rem !important;
      border: 2px solid #60a5fa !important;
      box-shadow: 0 3px 8px rgba(29, 78, 216, 0.4) !important;
      letter-spacing: 0.5px;
    }

    /* 🔥 需求 5：觀看模式流管群組外框卡片與相近色彩主題 */
    .type-group-wrapper {
      margin-bottom: 14px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .type-group-header {
      padding: 8px 14px;
      font-weight: 900;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid rgba(0,0,0,0.1);
    }

    /* 色彩主題群組樣式 */
    .theme-blue { border-color: #93c5fd; }
    .theme-blue .type-group-header { background-color: #eff6ff; color: #1d4ed8; }
    .theme-orange { border-color: #fed7aa; }
    .theme-orange .type-group-header { background-color: #fff7ed; color: #c2410c; }
    .theme-green { border-color: #a7f3d0; }
    .theme-green .type-group-header { background-color: #f0fdf4; color: #047857; }
    .theme-purple { border-color: #e9d5ff; }
    .theme-purple .type-group-header { background-color: #faf5ff; color: #7e22ce; }
    .theme-cyan { border-color: #a5f3fc; }
    .theme-cyan .type-group-header { background-color: #ecfeff; color: #0e7490; }

    .callsign-shortcut-popover {
      position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 2px solid #766D79; border-radius: 10px; padding: 5px 8px; display: flex; gap: 6px; z-index: 9999;
    }
    .callsign-shortcut-popover.hidden { opacity: 0; pointer-events: none; }
    .shortcut-pop-btn { padding: 5px 12px; font-size: 0.92rem; font-weight: 900; background-color: #ffffff; color: #1e40af; border: 1.5px solid #766D79; border-radius: 6px; cursor: pointer; }

    /* 圖表與排行榜 */
    .dashboard-charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .chart-card { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    .chart-title { font-size: 0.95rem; font-weight: bold; color: #0f2a4a; margin-bottom: 6px; align-self: flex-start; }
    .chart-canvas { width: 100%; height: 180px; background: #ffffff; border-radius: 6px; border: 1px solid #cbd5e1; }

    .leaderboard-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .lb-card { background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .lb-rank-num { font-size: 1.4rem; font-weight: 900; color: #64748b; min-width: 46px; text-align: center; }
    .lb-title-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
    .lb-type-name { font-size: 1.25rem; font-weight: 900; color: #0f2a4a; }

    .stats-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .stat-box { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; text-align: center; }
    .stat-number { font-size: 1.5rem; font-weight: bold; color: #1e40af; }
    .stat-label { font-size: 0.85rem; color: #64748b; font-weight: bold; }

    .filter-controls-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background-color: #f1f5f9; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #cbd5e1; }
    .multi-type-container { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; background: #ffffff; padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1; }

    .shift-log-form { background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .shift-log-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .tag-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: #fff; }
    .tag-routine { background-color: #2563eb; } .tag-flow { background-color: #f97316; } .tag-weather { background-color: #0284c7; } .tag-equip { background-color: #dc2626; } .tag-other { background-color: #64748b; }

    .shift-log-card { background-color: #ffffff; border-left: 5px solid #1e40af; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
    .shift-log-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem; color: #64748b; font-weight: bold; }
    .shift-log-body { font-size: 1rem; color: #0f172a; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }

    /* Modal Backdrop */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }

  <script>
    // ===================================================
    // 🔥【Firebase 雲端連線設定】
    // ===================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAxol8m7IZQ52P2UshQjFFWLsP5xi1nv2s",
      authDomain: "rctp-flowcontrol.firebaseapp.com",
      databaseURL: "https://rctp-flowcontrol-default-rtdb.firebaseio.com",
      projectId: "rctp-flowcontrol",
      storageBucket: "rctp-flowcontrol.firebasestorage.app",
      messagingSenderId: "956228851539",
      appId: "1:956228851539:web:b2bb6fcf556742c751b3a6",
      measurementId: "G-XL2NKDY8YV"
    };

    const isFirebaseConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
    if (isFirebaseConfigured) {
      firebase.initializeApp(firebaseConfig);
    }

    const STORAGE_KEY = 'offlineUtcEtdPbtCalculator_v1';
    const DEFAULT_TYPE_IDS = ['KPL', 'KB', 'MK', 'RJ', 'RK', 'JP', 'SU', 'VH', 'VM', 'SALMI', 'ELATO', 'KASKA', 'BORDO', 'SEDKU'];
    const MAX_CUSTOM_TYPES = 5;
    const TOTAL_DATA_ROWS = 50;

    let isEditor = false;
    let isRemoteUpdate = false;

    let appState = {
      version: 9,
      activeTypeId: 'KPL',
      visibleTypeIds: ['KPL'],
      viewMode: 'list',
      listFilter: 'all',
      leaderboardFilter: 'all',
      types: [],
      rows: {},
      historyLogs: [],
      shiftLogs: [],
      selectedHistoryTypes: []
    };

    let tempSelectedTypeIds = [];
    let activeInputRef = null;
    let isShortcutInteracting = false;
    let draggedRowIndex = null;

    function createEmptyRows() {
      const rows = [];
      for (let i = 0; i < TOTAL_DATA_ROWS; i++) {
        rows.push({ callsign: '', etd: '', atd: '', pbt: '' });
      }
      return rows;
    }

    function sanitizeCallsign(val) { return val ? String(val) : ''; }

    function createDefaultState() {
      const types = DEFAULT_TYPE_IDS.map(id => ({ id: id, name: id, isDefault: true, minutes: '' }));
      const rows = {};
      types.forEach(t => { rows[t.id] = createEmptyRows(); });
      return {
        version: 9, activeTypeId: 'KPL', visibleTypeIds: ['KPL'], viewMode: 'list', listFilter: 'all',
        leaderboardFilter: 'all', types: types, rows: rows, historyLogs: [], shiftLogs: [], selectedHistoryTypes: [...DEFAULT_TYPE_IDS]
      };
    }

    function normalizeTimeInput(value) {
      if (!value) return '';
      let str = String(value).trim();
      if (str.length === 3 && /^\d{3}$/.test(str)) return str.padStart(4, '0');
      return str;
    }

    function isValidTime(value) {
      if (!value) return true;
      if (!/^\d{4}$/.test(value)) return false;
      const hh = parseInt(value.slice(0, 2), 10);
      const mm = parseInt(value.slice(2, 4), 10);
      return hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59;
    }

    function timeToMinutes(hhmm) {
      if (!hhmm || hhmm.length !== 4) return 0;
      return parseInt(hhmm.slice(0, 2), 10) * 60 + parseInt(hhmm.slice(2, 4), 10);
    }

    function minutesToTime(minutes) {
      const normalized = ((minutes % 1440) + 1440) % 1440;
      const h = Math.floor(normalized / 60);
      const m = normalized % 60;
      return String(h).padStart(2, '0') + String(m).padStart(2, '0');
    }

    function isValidMinutes(value) {
      if (!value) return true;
      const str = String(value).trim();
      if (!/^\d+$/.test(str)) return false;
      const num = Number(str);
      return Number.isInteger(num) && num >= 0;
    }

    function recalculateType(typeId) {
      const typeObj = appState.types.find(t => t.id === typeId);
      if (!typeObj) return;
      const rows = appState.rows[typeId];
      if (!rows) return;

      const minsVal = String(typeObj.minutes).trim();
      const hasValidMins = minsVal !== '' && isValidMinutes(minsVal);
      const minutes = hasValidMins ? parseInt(minsVal, 10) : null;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const callsignHasValue = row.callsign && String(row.callsign).trim() !== '';

        if (i === 0) {
          if (isValidTime(row.etd) && row.etd !== '') {
            row.pbt = minutesToTime(timeToMinutes(row.etd) - 20);
          } else { row.pbt = ''; }
        } else {
          if (!callsignHasValue || minutes === null) {
            row.etd = ''; row.pbt = '';
          } else {
            const prevRow = rows[i - 1];
            let baseMins = null;
            if (isValidTime(prevRow.atd) && prevRow.atd !== '') baseMins = timeToMinutes(prevRow.atd);
            else if ((!prevRow.atd || prevRow.atd === '') && isValidTime(prevRow.etd) && prevRow.etd !== '') baseMins = timeToMinutes(prevRow.etd);

            if (baseMins !== null) {
              const etdMins = baseMins + minutes;
              row.etd = minutesToTime(etdMins);
              row.pbt = minutesToTime(etdMins - 20);
            } else { row.etd = ''; row.pbt = ''; }
          }
        }
      }
    }

    function updateVisualGuidanceState() {
      const currentType = appState.types.find(t => t.id === appState.activeTypeId);
      if (!currentType) return;

      const minsInput = document.getElementById('inputMinutes');
      const step1Pill = document.getElementById('step1Pill');
      const step2Pill = document.getElementById('step2Pill');
      const step2Badge = document.getElementById('step2Badge');
      const etd1Input = document.getElementById('inputEtd1');

      if (!isEditor) {
        if (step1Pill) step1Pill.classList.add('hidden');
        if (step2Pill) step2Pill.classList.add('hidden');
        if (step2Badge) step2Badge.classList.add('hidden');
        if (minsInput) minsInput.classList.remove('guide-glow-step1');
        if (etd1Input) etd1Input.classList.remove('guide-glow-step2');
        return;
      }

      if (step1Pill) step1Pill.classList.remove('hidden');
      if (step2Pill) step2Pill.classList.remove('hidden');
      if (step2Badge) step2Badge.classList.remove('hidden');

      const rows = appState.rows[appState.activeTypeId] || [];
      const row1EtdVal = rows[0] ? rows[0].etd : '';

      const isMinsFilled = minsInput && minsInput.value.trim() !== '' && isValidMinutes(minsInput.value.trim());
      const isRow1EtdFilled = /^\d{4}$/.test(String(row1EtdVal).trim()) && isValidTime(row1EtdVal);

      if (isMinsFilled && isRow1EtdFilled) {
        if (minsInput) minsInput.classList.remove('guide-glow-step1');
        if (etd1Input) etd1Input.classList.remove('guide-glow-step2');
        if (step1Pill) { step1Pill.className = 'step-pill shrunk-check'; step1Pill.innerHTML = '✓'; }
        if (step2Pill) { step2Pill.className = 'step-pill shrunk-check'; step2Pill.innerHTML = '✓'; }
        if (step2Badge) { step2Badge.className = 'step-pill shrunk-check'; step2Badge.innerHTML = '✓'; }
      } else if (isMinsFilled && !isRow1EtdFilled) {
        if (minsInput) minsInput.classList.remove('guide-glow-step1');
        if (etd1Input) etd1Input.classList.add('guide-glow-step2');
        if (step1Pill) { step1Pill.className = 'step-pill shrunk-check'; step1Pill.innerHTML = '✓'; }
        if (step2Pill) { step2Pill.className = 'step-pill step-pill-2 active-guide'; step2Pill.innerHTML = 'STEP ②'; }
        if (step2Badge) { step2Badge.className = 'step-pill step-pill-2 active-guide'; step2Badge.innerHTML = 'STEP ②'; }
      } else {
        if (minsInput) minsInput.classList.add('guide-glow-step1');
        if (etd1Input) etd1Input.classList.remove('guide-glow-step2');
        if (step1Pill) { step1Pill.className = 'step-pill step-pill-1 active-guide'; step1Pill.innerHTML = 'STEP ①'; }
        if (step2Pill) { step2Pill.className = 'step-pill step-pill-2'; step2Pill.innerHTML = 'STEP ②'; }
        if (step2Badge) { step2Badge.className = 'step-pill step-pill-2'; step2Badge.innerHTML = 'STEP ②'; }
      }
    }

    /* 🔥 需求 7：動態切換表頭名稱 (觀看模式 vs 管制員編輯模式) */
    function updateDynamicTableHeaders() {
      const etdText = isEditor ? 'ETD' : '預計起飛時間';
      const atdText = isEditor ? 'ATD' : '實際起飛時間';
      const pbtText = isEditor ? '預估後推(ETD-20分)' : '預估後推時間';

      // 工作表編輯表頭
      const thWorksheetEtd = document.getElementById('thWorksheetEtd');

      const thWorksheetPbt = document.getElementById('thWorksheetPbt');
      if (thWorksheetEtd) thWorksheetEtd.textContent = etdText;
      if (thWorksheetAtd) thWorksheetAtd.textContent = atdText;
      if (thWorksheetPbt) thWorksheetPbt.textContent = pbtText;

      // 紀錄及分析表頭
      const thHistoryAtd = document.getElementById('thHistoryAtd');

    function saveData(syncToCloud = false) {
      if (isRemoteUpdate) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (syncToCloud && isEditor && isFirebaseConfigured && firebase.apps.length) {
          firebase.database().ref('appState').set(appState);
        }
      } catch (e) {
        console.error('儲存失敗', e);
      }
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.types) && parsed.rows) {
            appState = parsed;
            appState.historyLogs = appState.historyLogs || [];
            appState.shiftLogs = appState.shiftLogs || [];
            appState.visibleTypeIds = Array.isArray(appState.visibleTypeIds) && appState.visibleTypeIds.length > 0 ? appState.visibleTypeIds : ['KPL'];

            DEFAULT_TYPE_IDS.forEach(id => {
              if (!appState.types.some(t => t.id === id)) {
                appState.types.push({ id: id, name: id, isDefault: true, minutes: '' });
              }
            });

            appState.types.forEach(t => {
              if (!appState.rows[t.id]) appState.rows[t.id] = createEmptyRows();
              while (appState.rows[t.id].length < TOTAL_DATA_ROWS) {
                appState.rows[t.id].push({ callsign: '', etd: '', atd: '', pbt: '' });
              }
              recalculateType(t.id);
            });
            return;
          }
        }
      } catch (e) { console.warn('載入預設設定', e); }
      appState = createDefaultState();
      appState.types.forEach(t => recalculateType(t.id));
      saveData();
    }

    function initFirebaseSync() {
      if (!isFirebaseConfigured || !firebase.apps.length) return;

      firebase.database().ref('appState').on('value', snapshot => {
        const data = snapshot.val();
        if (data && data.types && data.rows) {
          const activeEl = document.activeElement;
          const isTyping = activeEl && activeEl.tagName === 'INPUT' && activeEl.closest('#worksheetView');

          isRemoteUpdate = true;
          appState = data;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
          isRemoteUpdate = false;

          renderTypeButtons();

          if (!isTyping) {
            if (appState.viewMode === 'worksheet') renderWorksheet();
            else if (appState.viewMode === 'list') renderList();
            else if (appState.viewMode === 'history') renderHistoryAndStatistics();
            else if (appState.viewMode === 'leaderboard') renderLeaderboard();
            else if (appState.viewMode === 'shiftLog') renderShiftLogs();
          } else {
            updateCalculatedCellsInDOM();
          }
        }
      });

      firebase.auth().onAuthStateChanged(user => {
        if (user) {
          isEditor = true;
          document.getElementById('roleBadge').className = 'status-role-badge role-editor';
          document.getElementById('roleBadge').textContent = '⚡ 管制員 (編輯模式)';
          document.getElementById('btnLoginHeader').classList.add('hidden');
          document.getElementById('btnLogoutHeader').classList.remove('hidden');

          document.querySelectorAll('.restricted-tab').forEach(el => el.classList.remove('hidden'));
          document.querySelectorAll('.editor-only-btn').forEach(el => el.classList.remove('hidden'));

          updateDynamicTableHeaders();
          updateTypeSelectionBarVisibility();

          // 切換至工作表編輯視圖
          document.getElementById('tabWorksheet').click();
        } else {
          isEditor = false;
          document.getElementById('roleBadge').className = 'status-role-badge role-viewer';
          document.getElementById('roleBadge').textContent = '👁️ 觀看模式';
          document.getElementById('btnLoginHeader').classList.remove('hidden');
          document.getElementById('btnLogoutHeader').classList.add('hidden');

          document.querySelectorAll('.restricted-tab').forEach(el => el.classList.add('hidden'));
          document.querySelectorAll('.editor-only-btn').forEach(el => el.classList.add('hidden'));

          updateDynamicTableHeaders();
          updateTypeSelectionBarVisibility();

          // 觀看模式下：預設停留於「查看各類型列表」
          document.getElementById('tabList').click();
        }
      });
    }

    /* 🔥 需求 2：僅在「工作表編輯」且為「編輯模式」時顯示選擇流管類型按鈕 */
    function updateTypeSelectionBarVisibility() {
      const typeBar = document.getElementById('typeSelectionBar');
      if (!typeBar) return;
      if (appState.viewMode === 'worksheet' && isEditor) {
        typeBar.classList.remove('hidden');
      } else {
        typeBar.classList.add('hidden');
      }
    }

    /* 🔥 需求 3 & 4 修復：將工作表內有輸之航班自動補登至歷史紀錄與排行榜運算 */
    function syncCurrentRowsToHistoryLogs() {
      const todayStr = "2026-09-14";
      const now = new Date();
      
      appState.types.forEach(t => {
        const rows = appState.rows[t.id] || [];
        rows.forEach((r, idx) => {
          if (r.callsign && String(r.callsign).trim() !== '' && r.atd && isValidTime(r.atd)) {
            const callsignClean = String(r.callsign).trim();
            const existing = appState.historyLogs.find(l => l.typeId === t.id && l.seq === (idx + 1) && l.callsign === callsignClean);
            
            if (!existing) {
              appState.historyLogs.push({
                id: 'log_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                timestamp: `${todayStr} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
                date: todayStr,
                atdHour: r.atd.slice(0, 2),
                typeId: t.id,
                typeName: t.name,
                seq: idx + 1,
                callsign: callsignClean,
                atd: r.atd,
                etd: r.etd,
                pbt: r.pbt
              });
            } else {
              existing.atd = r.atd;
              existing.etd = r.etd;
              existing.pbt = r.pbt;
              existing.atdHour = r.atd.slice(0, 2);
            }
          }
        });
      });
    }

    function autoLogATD(typeId, seq, callsign, atd, etd, pbt) {
      if (!isEditor || !atd || atd.length !== 4 || !isValidTime(atd) || !callsign) return;
      const typeObj = appState.types.find(t => t.id === typeId);
      const typeName = typeObj ? typeObj.name : typeId;
      const todayStr = "2026-09-14";
      const now = new Date();
      const timestampStr = `${todayStr} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

      const logItem = {
        id: 'log_' + Date.now(), timestamp: timestampStr, date: todayStr,
        atdHour: atd.slice(0, 2), typeId: typeId, typeName: typeName, seq: seq, callsign: String(callsign).trim(), atd: atd, etd: etd, pbt: pbt
      };

      const existingIndex = appState.historyLogs.findIndex(l => l.typeId === typeId && l.seq === seq && l.callsign === String(callsign).trim());
      if (existingIndex >= 0) appState.historyLogs[existingIndex] = logItem;
      else appState.historyLogs.push(logItem);
      saveData(true);
    }

    function clearRowAndShift(idx) {
      if (!isEditor) return;
      const rows = appState.rows[appState.activeTypeId];
      if (!rows || idx < 0 || idx >= TOTAL_DATA_ROWS) return;
      rows.splice(idx, 1);
      rows.push({ callsign: '', etd: '', atd: '', pbt: '' });
      recalculateType(appState.activeTypeId);
      saveData(true);
      renderWorksheet();
    }

    function swapCallsigns(srcIndex, tgtIndex) {
      if (!isEditor) return;
      const rows = appState.rows[appState.activeTypeId];
      if (!rows || srcIndex === tgtIndex) return;
      const temp = rows[srcIndex].callsign;
      rows[srcIndex].callsign = rows[tgtIndex].callsign;
      rows[tgtIndex].callsign = temp;
      recalculateType(appState.activeTypeId);
      saveData(true);
      renderWorksheet();
    }

    function renderTypeButtons() {
      const container = document.getElementById('typeButtonsContainer');
      if (!container) return;
      container.innerHTML = '';
      if (!Array.isArray(appState.visibleTypeIds) || appState.visibleTypeIds.length === 0) {
        appState.visibleTypeIds = [appState.activeTypeId];
      }

      appState.types.forEach(t => {
        if (appState.visibleTypeIds.includes(t.id)) {
          const btn = document.createElement('button');
          const isActive = t.id === appState.activeTypeId;
          btn.className = `btn btn-type-sm ${isActive ? 'active' : ''}`;
          btn.textContent = t.name;
          btn.onclick = () => switchType(t.id);
          container.appendChild(btn);
        }
      });

      const activeTypeObj = appState.types.find(t => t.id === appState.activeTypeId);
      document.getElementById('displayActiveType').textContent = activeTypeObj ? activeTypeObj.name : '';
      renderListActiveTypesCard();
    }

    function renderListActiveTypesCard() {
      const cardContainer = document.getElementById('listActiveTypesCardContainer');
      if (!cardContainer) return;
      cardContainer.innerHTML = '';

      if (!Array.isArray(appState.visibleTypeIds) || appState.visibleTypeIds.length === 0) {
        cardContainer.innerHTML = '<span style="color:#64748b; font-size:0.9rem;">無選取類型</span>';

        if (appState.visibleTypeIds.includes(t.id)) {
          const badge = document.createElement('span');
          badge.className = 'active-type-badge';
          badge.style.fontSize = '0.92rem';

    function renderModalTypeGrid() {
      const grid = document.getElementById('modalTypeGrid');
      grid.innerHTML = '';

      appState.types.forEach(t => {
        const itemWrap = document.createElement('div');
        itemWrap.style.position = 'relative';
        itemWrap.style.display = 'inline-flex';
        itemWrap.style.flex = '1 0 calc(25% - 8px)';
        itemWrap.style.minWidth = '95px';

        const btn = document.createElement('button');
        const isSelected = tempSelectedTypeIds.includes(t.id);
        btn.className = `modal-type-btn ${isSelected ? 'active' : ''}`;
        btn.type = 'button';
        btn.style.width = '100%';
        if (!t.isDefault && isEditor) btn.style.paddingRight = '24px';
        btn.textContent = `${t.name} ${isSelected ? '✓' : ''}`;

        btn.onclick = () => {
          if (tempSelectedTypeIds.includes(t.id)) {
            tempSelectedTypeIds = tempSelectedTypeIds.filter(id => id !== t.id);
          } else {
            tempSelectedTypeIds.push(t.id);
          }
          renderModalTypeGrid();
        };
        itemWrap.appendChild(btn);

        if (!t.isDefault && isEditor) {
          const delBtn = document.createElement('button');
          delBtn.type = 'button'; delBtn.className = 'type-delete-x'; delBtn.textContent = '✕';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            openModal({
              title: '確認刪除',
              bodyHTML: `<p>確定要刪除「<strong>${t.name}</strong>」類型嗎？</p>`,
              confirmText: '確認刪除',
              onConfirm: () => {
                delete appState.rows[t.id];
                appState.types = appState.types.filter(item => item.id !== t.id);
                appState.visibleTypeIds = appState.visibleTypeIds.filter(id => id !== t.id);
                tempSelectedTypeIds = tempSelectedTypeIds.filter(id => id !== t.id);
                if (appState.activeTypeId === t.id) appState.activeTypeId = appState.visibleTypeIds[0] || 'KPL';
                saveData(true); renderModalTypeGrid(); renderTypeButtons(); renderWorksheet(); return true;
              }
            });
          };
          itemWrap.appendChild(delBtn);
        }
        grid.appendChild(itemWrap);
      });
    }

    function openTypeModal() {
      tempSelectedTypeIds = Array.isArray(appState.visibleTypeIds) && appState.visibleTypeIds.length > 0 ? [...appState.visibleTypeIds] : [appState.activeTypeId];
      renderModalTypeGrid();
      document.getElementById('typeSelectorModal').classList.add('active');
    }

    function closeTypeModal() { document.getElementById('typeSelectorModal').classList.remove('active'); }

    function confirmTypeModal() {
      if (tempSelectedTypeIds.length === 0) {
        alert('請至少勾選一種流管類型！'); return;
      }
      appState.visibleTypeIds = [...tempSelectedTypeIds];
      if (!appState.visibleTypeIds.includes(appState.activeTypeId)) appState.activeTypeId = appState.visibleTypeIds[0];
      saveData(true); renderTypeButtons(); renderWorksheet(); closeTypeModal();
    }

    function renderWorksheet() {
      const currentType = appState.types.find(t => t.id === appState.activeTypeId);
      if (!currentType) return;

      const minsInput = document.getElementById('inputMinutes');
      minsInput.value = currentType.minutes;
      minsInput.readOnly = !isEditor;

      const btnDelete = document.getElementById('btnDeleteType');
      const btnRename = document.getElementById('btnRenameType');
      const btnClearCurrent = document.getElementById('btnClearCurrentData');
      const btnResetAll = document.getElementById('btnResetAll');

      if (!isEditor) {
        btnDelete.classList.add('hidden');
        btnRename.classList.add('hidden');
        if (btnClearCurrent) btnClearCurrent.classList.add('hidden');
        if (btnResetAll) btnResetAll.classList.add('hidden');
      } else {
        if (btnClearCurrent) btnClearCurrent.classList.remove('hidden');
        if (btnResetAll) btnResetAll.classList.remove('hidden');

          saveData(false);

          updateVisualGuidanceState();

        inputAtd.maxLength = 4; inputAtd.placeholder = 'hhmm'; inputAtd.value = row.atd;
        inputAtd.readOnly = !isEditor;

        inputAtd.oninput = (e) => {

          recalculateType(appState.activeTypeId);

    function updateCalculatedCellsInDOM() {
      const rows = appState.rows[appState.activeTypeId];
      if (!rows) return;
      rows.forEach((row, i) => {
        if (i > 0) { const etdEl = document.getElementById(`etd-cell-${i}`); if (etdEl) etdEl.textContent = row.etd; }

      });

    /* 🔥 需求 5 & 6：觀看模式同類型邊框分組卡片與詳細筆數統計 */
    function renderList() {
      const groupedContainer = document.getElementById('listGroupedContainer');
      const summaryTextEl = document.getElementById('listSummaryText');
      if (!groupedContainer) return;

      groupedContainer.innerHTML = '';

      const colorThemes = ['theme-blue', 'theme-orange', 'theme-green', 'theme-purple', 'theme-cyan'];
      let totalCount = 0;
      let summaryParts = [];

      const targetTypes = Array.isArray(appState.visibleTypeIds) && appState.visibleTypeIds.length > 0
        ? appState.types.filter(t => appState.visibleTypeIds.includes(t.id))
        : appState.types;

      const etdText = isEditor ? 'ETD' : '預計起飛時間';
      const atdText = isEditor ? 'ATD' : '實際起飛時間';
      const pbtText = isEditor ? '預估後推(ETD-20分)' : '預估後推時間';

      targetTypes.forEach((t, themeIdx) => {
        const rows = appState.rows[t.id] || [];
        const activeRows = [];

        rows.forEach((r, idx) => {
          if (r.callsign && String(r.callsign).trim() !== '') {
            activeRows.push({ ...r, seq: idx + 1 });
          }
        });

        if (activeRows.length > 0) {
          totalCount += activeRows.length;
          summaryParts.push(`<strong>${t.name}</strong> 共 <strong style="color:#2563eb;">${activeRows.length}</strong> 筆`);

          const themeClass = colorThemes[themeIdx % colorThemes.length];
          const groupCard = document.createElement('div');
          groupCard.className = `type-group-wrapper ${themeClass}`;

          let rowsHTML = '';
          activeRows.forEach(r => {
            rowsHTML += `
              <tr>
                <td><span class="active-type-badge" style="font-size:0.85rem; padding:2px 8px;">${t.name}</span></td>
                <td><strong>${r.seq}</strong></td>
                <td><strong>${r.callsign}</strong></td>
                <td>${r.etd || ''}</td>
                <td>${r.atd || ''}</td>
                <td><span class="read-only-cell pbt">${r.pbt || ''}</span></td>
              </tr>
            `;
          });

          groupCard.innerHTML = `
            <div class="type-group-header">
              <span>✈️ 流管類別：${t.name} (間隔 ${t.minutes || '--'} 分鐘)</span>
              <span style="font-size:0.88rem; font-weight:bold;">受影響航班：${activeRows.length} 架次</span>
            </div>
            <div class="table-responsive" style="border:none; border-radius:0;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="width: 12%;">類型</th>
                    <th style="width: 8%;">順序</th>
                    <th style="width: 20%;">呼號</th>
                    <th style="width: 18%;">${etdText}</th>
                    <th style="width: 18%;">${atdText}</th>
                    <th style="width: 24%;" class="nowrap-text highlight-pbt-header">${pbtText}</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHTML}
                </tbody>
              </table>
            </div>
          `;

          groupedContainer.appendChild(groupCard);
        }
      });

      if (totalCount === 0) {
        summaryTextEl.innerHTML = '目前各流量管制種類無航班資料';
        groupedContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b; font-weight:bold; background:#f8fafc; border-radius:8px;">目前無任何受影響之流管航班資訊</div>';
      } else {
        summaryTextEl.innerHTML = `目前 ${summaryParts.join('、')}，總計 <strong style="color:#d97706; font-size:1.15rem;">${totalCount}</strong> 筆受影響航班`;
      }
    }

    function renderCharts() {
      const logs = appState.historyLogs || [];
      const barCanvas = document.getElementById('chartHourlyBar');
      if (barCanvas) {
        const ctx = barCanvas.getContext('2d');
        const rect = barCanvas.getBoundingClientRect();
        barCanvas.width = rect.width; barCanvas.height = 180;
        ctx.clearRect(0, 0, rect.width, 180);
        const hourCounts = new Array(24).fill(0);
        logs.forEach(l => { const hr = parseInt(l.atdHour, 10); if (!isNaN(hr) && hr >= 0 && hr < 24) hourCounts[hr]++; });
        const maxVal = Math.max(...hourCounts, 5);
        const barWidth = (rect.width - 40) / 24;
        hourCounts.forEach((val, i) => {
          const bH = (val / maxVal) * 140;
          ctx.fillStyle = '#2563eb'; ctx.fillRect(30 + i * barWidth, 160 - bH, barWidth - 2, bH);
        });
      }
    }

    function renderHistoryAndStatistics() {
      syncCurrentRowsToHistoryLogs();
      filterAndRenderHistoryTable();
      renderCharts();
    }

    /* 🔥 需求 4 修復：排行榜資料運算 */
    function renderLeaderboard() {
      syncCurrentRowsToHistoryLogs();
      const container = document.getElementById('leaderboardListContainer');
      if (!container) return;
      container.innerHTML = '';

      const logs = appState.historyLogs || [];
      if (logs.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; padding:30px; font-weight:bold;">尚無流量管制歷史紀錄</div>';
        return;
      }

      const typeStats = {};
      logs.forEach(l => {
        const name = l.typeName || l.typeId;
        if (!typeStats[name]) {
          typeStats[name] = { count: 0, callsigns: new Set() };
        }
        typeStats[name].count++;
        if (l.callsign) typeStats[name].callsigns.add(l.callsign);
      });

      const sorted = Object.keys(typeStats).map(k => ({ name: k, ...typeStats[k] })).sort((a, b) => b.count - a.count);
      const medalIcons = ['🥇', '🥈', '🥉'];

      sorted.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'lb-card';
        const medal = idx < 3 ? medalIcons[idx] : `#${idx + 1}`;

        card.innerHTML = `
          <div class="lb-title-group">
            <span class="lb-rank-num" style="font-size:1.6rem;">${medal}</span>
            <div>
              <div class="lb-type-name">${item.name}</div>
            </div>
          </div>
          <div class="lb-stats-group">
            <div class="lb-stat-item">
              <span class="lb-stat-value" style="color:#2563eb;">${item.count} 次</span>
              <span class="lb-stat-label">流管次數</span>
            </div>
            <div class="lb-stat-item">
              <span class="lb-stat-value" style="color:#0284c7;">${item.callsigns.size} 架次</span>
              <span class="lb-stat-label">不重複航班數</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterAndRenderHistoryTable() {
      const tbody = document.getElementById('historyTbody');
      if (!tbody) return;
      tbody.innerHTML = '';
      (appState.historyLogs || []).slice().reverse().forEach(l => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${l.timestamp}</td><td>${l.date}</td><td>${l.atdHour}時</td><td><span class="active-type-badge" style="font-size:0.85rem; padding:2px 6px;">${l.typeName}</span></td><td>${l.seq}</td><td><strong>${l.callsign}</strong></td><td>${l.atd}</td><td>${l.etd}</td><td><span class="read-only-cell pbt" style="font-size:0.9rem;">${l.pbt}</span></td>`;
        tbody.appendChild(tr);
      });
    }

    function renderShiftLogs() {
      const container = document.getElementById('shiftLogContainer');
      if (!container) return;
      container.innerHTML = '';
      (appState.shiftLogs || []).slice().reverse().forEach(log => {
        const card = document.createElement('div'); card.className = 'shift-log-card';
        card.innerHTML = `<div class="shift-log-header"><strong>${log.author}</strong><span>${log.timestamp}</span></div><div class="shift-log-body">${log.content}</div>`;
        container.appendChild(card);
      });
    }

    function addShiftLog() {
      if (!isEditor) return;
      const content = document.getElementById('shiftContentInput').value.trim();
      if (!content) return;
      appState.shiftLogs.push({ id: 'shift_' + Date.now(), timestamp: new Date().toLocaleString(), author: document.getElementById('shiftAuthorInput').value || 'ATCO', content: content });
      saveData(true); renderShiftLogs(); document.getElementById('shiftContentInput').value = '';
    }

    function switchType(typeId) {
      appState.activeTypeId = typeId;
      recalculateType(typeId); saveData(false); renderTypeButtons(); renderWorksheet();
    }

    function openModal({ title, bodyHTML, confirmText = '確認', cancelText = '取消', onConfirm }) {
      const modal = document.getElementById('appModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHTML;
      const btnConfirm = document.getElementById('btnModalConfirm');
      const btnCancel = document.getElementById('btnModalCancel');
      btnConfirm.textContent = confirmText; btnCancel.textContent = cancelText;

      const closeModal = () => { modal.classList.remove('active'); btnConfirm.onclick = null; btnCancel.onclick = null; };
      btnCancel.onclick = closeModal;
      btnConfirm.onclick = () => { if (onConfirm()) closeModal(); };
      modal.classList.add('active');
    }

    function openLoginModal() {
      if (!isFirebaseConfigured) {
        openModal({
          title: '⚠️ 尚未設定 Firebase',
          bodyHTML: '<p style="color:#dc2626;">請先在 HTML 程式碼內的 <code>firebaseConfig</code> 填入您個人的 Firebase 金鑰資訊！</p>',
          confirmText: '了解',
          cancelText: '關閉',
          onConfirm: () => true
        });
        return;
      }

      openModal({
        title: '🔑 管制員登入',
        bodyHTML: `
          <div style="display:flex; flex-direction:column; gap:10px;">
            <label style="font-weight:bold;">管制員 Email：</label>
            <input type="email" id="loginEmail" class="input-field" style="width:100%; text-align:left;" placeholder="your-email@tower.com">
            <label style="font-weight:bold;">密碼：</label>
            <input type="password" id="loginPassword" class="input-field" style="width:100%; text-align:left;" placeholder="••••••••">
            <span id="loginError" class="error-text hidden"></span>
          </div>
        `,
        confirmText: '登入',
        onConfirm: () => {
          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value.trim();
          const errEl = document.getElementById('loginError');

          if (!email || !password) {
            errEl.textContent = '請輸入 Email 與密碼';
            errEl.classList.remove('hidden');
            return false;
          }

          const btnConfirm = document.getElementById('btnModalConfirm');
          btnConfirm.disabled = true;
          btnConfirm.textContent = '驗證中...';

          firebase.auth().signInWithEmailAndPassword(email, password)
            .then(() => {
              btnConfirm.disabled = false;
              document.getElementById('appModal').classList.remove('active');
            })
            .catch(err => {
              btnConfirm.disabled = false;
              btnConfirm.textContent = '登入';
              errEl.textContent = '登入失敗：' + (err.message || '帳號或密碼錯誤');
              errEl.classList.remove('hidden');
            });

          return false;
        }
      });
    }

    /* 🔥 需求 1 修復：呼號捷徑選單彈出與穩定綁定 */
    function showCallsignPopover(inputEl) {
      if (!isEditor) return;
      activeInputRef = inputEl;
      const popover = document.getElementById('callsignShortcutPopover');
      const wrapper = inputEl.closest('.callsign-cell-wrapper');
      if (wrapper && popover) {
        wrapper.appendChild(popover);
        popover.classList.remove('hidden');
      }
    }

    function hideCallsignPopover() {
      const popover = document.getElementById('callsignShortcutPopover');
      if (popover) popover.classList.add('hidden');
    }

    function bindCallsignShortcutPopover(inputEl) {
      if (!isEditor) return;
      const handler = () => showCallsignPopover(inputEl);
      inputEl.addEventListener('focus', handler);
      inputEl.addEventListener('click', handler);
      inputEl.addEventListener('pointerdown', handler);
      inputEl.addEventListener('blur', () => {
        setTimeout(() => {
          if (!isShortcutInteracting && document.activeElement !== activeInputRef) {
            hideCallsignPopover();
          }
        }, 200);
      });
    }

    function setupCallsignPopBtns() {
      const popover = document.getElementById('callsignShortcutPopover');
      if (!popover) return;
      const btns = popover.querySelectorAll('.shortcut-pop-btn');

      btns.forEach(btn => {
        const handleInsert = (e) => {
          e.preventDefault();
          e.stopPropagation();
          isShortcutInteracting = true;
          const text = btn.textContent.trim();
          if (activeInputRef && isEditor) {
            activeInputRef.value += text;
            activeInputRef.value = activeInputRef.value.toUpperCase();
            activeInputRef.dispatchEvent(new Event('input', { bubbles: true }));
            activeInputRef.focus();
          }
          setTimeout(() => { isShortcutInteracting = false; }, 200);
        };

        btn.onmousedown = handleInsert;
        btn.ontouchstart = handleInsert;
      });
    }

    function setupEventListeners() {
      document.getElementById('btnOpenTypeModal').onclick = openTypeModal;
      document.getElementById('btnCloseTypeModal').onclick = closeTypeModal;
      document.getElementById('btnCancelTypeModal').onclick = closeTypeModal;
      document.getElementById('btnConfirmTypeModal').onclick = confirmTypeModal;
      document.getElementById('btnAddCustomTypeModal').onclick = () => {
        openModal({
          title: '新增自訂類型',
          bodyHTML: '<input type="text" id="modalTypeName" class="input-field" style="width:100%; text-align:left;">',
          confirmText: '新增',
          onConfirm: () => {
            const name = document.getElementById('modalTypeName').value.trim();
            if (!name) return false;
            const newId = 'custom_' + Date.now();
            appState.types.push({ id: newId, name: name, isDefault: false, minutes: '' });
            appState.rows[newId] = createEmptyRows();
            tempSelectedTypeIds.push(newId);
            saveData(true); renderModalTypeGrid(); return true;
          }
        });
      };

      document.getElementById('btnLoginHeader').onclick = openLoginModal;
      document.getElementById('btnLogoutHeader').onclick = () => {
        if (confirm('確定要登出編輯模式嗎？')) {
          if (isFirebaseConfigured && firebase.apps.length) firebase.auth().signOut();
        }
      };

      document.getElementById('inputMinutes').oninput = (e) => {
        if (!isEditor) return;
        const currentType = appState.types.find(t => t.id === appState.activeTypeId);
        if (currentType) {
          currentType.minutes = e.target.value.trim();
          recalculateType(appState.activeTypeId);
          saveData(false);
          updateCalculatedCellsInDOM();
          updateVisualGuidanceState();
        }
      };

      document.getElementById('inputMinutes').onblur = () => {
        if (!isEditor) return;
        saveData(true);
      };

      document.getElementById('btnAddShiftLog').onclick = addShiftLog;

      const tabWorksheet = document.getElementById('tabWorksheet');
      const tabList = document.getElementById('tabList');
      const tabHistory = document.getElementById('tabHistory');
      const tabLeaderboard = document.getElementById('tabLeaderboard');
      const tabShiftLog = document.getElementById('tabShiftLog');

      const worksheetView = document.getElementById('worksheetView');
      const listView = document.getElementById('listView');
      const historyView = document.getElementById('historyView');
      const leaderboardView = document.getElementById('leaderboardView');
      const shiftLogView = document.getElementById('shiftLogView');

      tabWorksheet.onclick = () => {
        if (!isEditor) return;
        appState.viewMode = 'worksheet';
        [tabWorksheet, tabList, tabHistory, tabLeaderboard, tabShiftLog].forEach(t => t.classList.remove('active'));
        tabWorksheet.classList.add('active');
        [worksheetView, listView, historyView, leaderboardView, shiftLogView].forEach(v => v.classList.add('hidden'));
        worksheetView.classList.remove('hidden');
        updateTypeSelectionBarVisibility();
        renderWorksheet();
      };

      tabList.onclick = () => {
        appState.viewMode = 'list';
        [tabWorksheet, tabList, tabHistory, tabLeaderboard, tabShiftLog].forEach(t => t.classList.remove('active'));
        tabList.classList.add('active');
        [worksheetView, listView, historyView, leaderboardView, shiftLogView].forEach(v => v.classList.add('hidden'));
        listView.classList.remove('hidden');
        updateTypeSelectionBarVisibility();
        renderList();
      };

      tabHistory.onclick = () => {
        if (!isEditor) return;
        appState.viewMode = 'history';
        [tabWorksheet, tabList, tabHistory, tabLeaderboard, tabShiftLog].forEach(t => t.classList.remove('active'));
        tabHistory.classList.add('active');
        [worksheetView, listView, historyView, leaderboardView, shiftLogView].forEach(v => v.classList.add('hidden'));
        historyView.classList.remove('hidden');
        updateTypeSelectionBarVisibility();
        renderHistoryAndStatistics();
      };

      tabLeaderboard.onclick = () => {
        if (!isEditor) return;
        appState.viewMode = 'leaderboard';
        [tabWorksheet, tabList, tabHistory, tabLeaderboard, tabShiftLog].forEach(t => t.classList.remove('active'));
        tabLeaderboard.classList.add('active');
        [worksheetView, listView, historyView, leaderboardView, shiftLogView].forEach(v => v.classList.add('hidden'));
        leaderboardView.classList.remove('hidden');
        updateTypeSelectionBarVisibility();
        renderLeaderboard();
      };

      tabShiftLog.onclick = () => {
        if (!isEditor) return;
        appState.viewMode = 'shiftLog';
        [tabWorksheet, tabList, tabHistory, tabLeaderboard, tabShiftLog].forEach(t => t.classList.remove('active'));
        tabShiftLog.classList.add('active');
        [worksheetView, listView, historyView, leaderboardView, shiftLogView].forEach(v => v.classList.add('hidden'));
        shiftLogView.classList.remove('hidden');
        updateTypeSelectionBarVisibility();
        renderShiftLogs();
      };
    }

    function renderListFilterButtons() {}

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      setupEventListeners();
      setupCallsignPopBtns();
      renderTypeButtons();
      renderList();
      initFirebaseSync();
    });
  </script>
</body>
</html>
